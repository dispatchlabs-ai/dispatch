openapi: 3.1.0
info:
  title: Dispatch inference gateway
  version: 1.0.0
  description: Pi 1.3 inference using gateway-owned credentials. Workloads use the supplied Pi Models client.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200': { description: Process initialized }
  /v1/auth/aws:
    post:
      operationId: exchangeAwsIdentity
      description: Signed POST to sts.us-east-1.amazonaws.com with fixed GetCallerIdentity body and signed x-dispatch-gateway-audience. Proof age at most 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [headers]
              properties:
                headers: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Ten-minute scoped session
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: integer, description: Unix milliseconds }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/catalog:
    get:
      operationId: catalog
      security: [{ gateway: [] }]
      responses:
        '200':
          description: Granted native Pi models with gateway connection IDs and URLs; no upstream headers or credentials
          content:
            application/json:
              schema:
                type: object
                required: [version, connections]
                properties:
                  version: { const: 1 }
                  connections:
                    type: array
                    items:
                      type: object
                      required: [id, name, provider, models, images, classify, deferred]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        provider: { type: string, description: Native Pi provider ID }
                        models: { type: array, items: { type: object, description: Pi AnyModel metadata } }
                        images: { type: boolean }
                        classify: { type: boolean }
                        deferred: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/connections/{connection}/messages:
    post:
      operationId: stream
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Connection' }]
      requestBody: { $ref: '#/components/requestBodies/Messages' }
      responses:
        '200':
          description: Pi pi-messages compact SSE events; terminal done/error adds a complete sanitized Pi AssistantMessage under message. Deferred handles are gateway-sealed.
          content:
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/connections/{connection}/operations:
    post:
      operationId: operation
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Connection' }]
      requestBody: { $ref: '#/components/requestBodies/Operations' }
      responses:
        '200':
          description: Native sanitized Pi AssistantImages or ClassifierResult, or cancellation acknowledgement
          content:
            application/json: { schema: { type: object } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    gateway: { type: http, scheme: bearer }
  parameters:
    Connection:
      name: connection
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' }
  requestBodies:
    Messages:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Inference'
              - properties:
                  operation: { enum: [stream, streamSimple, fetchDeferred], default: streamSimple }
    Operations:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Inference'
              - required: [operation]
                properties:
                  operation: { enum: [cancelDeferred, generateImages, classify] }
  schemas:
    Inference:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: { type: string, minLength: 1 }
        operation: { type: string }
        context: { type: object, description: Native Pi Context, ImagesContext or ClassifierContext according to operation }
        handle: { type: object, description: Gateway-sealed Pi DeferredHandle for fetch/cancel }
        options: { type: object, description: Reviewed inference-only native Pi options. Unknown options and endpoint/auth/routing overrides are rejected. }
  responses:
    Error:
      description: Pre-admission HTTP error; x-request-id correlates safe server logs
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
