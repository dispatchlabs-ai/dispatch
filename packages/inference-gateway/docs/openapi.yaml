openapi: 3.1.0
info:
  title: Dispatch inference gateway
  version: 1.1.0
  description: Native Pi and stateless Responses inference using gateway-owned credentials. AWS, employee-session and scoped API-key callers share authorization and optional durable usage policies. Administrative operations require an explicitly configured AWS administrator.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200': { description: Process initialized }
  /v1/auth/aws:
    post:
      operationId: exchangeAwsIdentity
      description: Signed POST to sts.us-east-1.amazonaws.com with fixed GetCallerIdentity body and signed x-dispatch-gateway-audience. Proof age at most 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [headers]
              properties:
                headers: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Ten-minute scoped session
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: integer, description: Unix milliseconds }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/catalog:
    get:
      operationId: catalog
      security: [{ gateway: [] }]
      responses:
        '200':
          description: Granted native Pi models with gateway connection IDs and URLs; no upstream headers or credentials
          content:
            application/json:
              schema:
                type: object
                required: [version, connections]
                properties:
                  version: { const: 1 }
                  connections:
                    type: array
                    items:
                      type: object
                      required: [id, name, provider, models, images, classify, deferred]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        provider: { type: string, description: Native Pi provider ID }
                        models: { type: array, items: { type: object, description: Pi AnyModel metadata } }
                        images: { type: boolean }
                        classify: { type: boolean }
                        deferred: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/connections/{connection}/messages:
    post:
      operationId: stream
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Connection' }]
      requestBody: { $ref: '#/components/requestBodies/Messages' }
      responses:
        '200':
          description: Pi pi-messages compact SSE events; terminal done/error adds a complete sanitized Pi AssistantMessage under message. Deferred handles are gateway-sealed.
          content:
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/connections/{connection}/operations:
    post:
      operationId: operation
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Connection' }]
      requestBody: { $ref: '#/components/requestBodies/Operations' }
      responses:
        '200':
          description: Native sanitized Pi AssistantImages or ClassifierResult, or cancellation acknowledgement
          content:
            application/json: { schema: { type: object } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/models:
    get:
      operationId: responsesModels
      security: [{ gateway: [] }]
      responses:
        '200':
          description: Granted connection/model routes and configured aliases for native OpenAI Responses and OpenAI Codex providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        object: { const: model }
                        created: { type: integer }
                        owned_by: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /v1/responses:
    post:
      operationId: responses
      security: [{ gateway: [] }]
      description: Native provider Responses items and events through Pi. Replay complete conversation items and tool results. No stored response IDs, hosted tools, provider file IDs, background work, WebSocket transport or automatic inference replay. The employee-access guide defines supported options and boundaries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsesRequest' }
      responses:
        '200':
          description: Native Responses SSE or final JSON. Completion is withheld until configured durable accounting succeeds. Model names retain the requested route; headers identify the resolved connection/model. Streaming failures may end the stream.
          headers:
            x-request-id: { schema: { type: string } }
            x-dispatch-connection: { schema: { type: string } }
            x-dispatch-model: { schema: { type: string } }
            x-dispatch-budget-warning: { schema: { type: string } }
          content:
            text/event-stream: { schema: { type: string } }
            application/json: { schema: { type: object, description: Native Responses response object } }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/start:
    post:
      operationId: startEmployeeLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientName, codeChallenge]
              properties:
                clientName: { type: string, minLength: 1, maxLength: 100 }
                codeChallenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: Base64url SHA-256 of the client PKCE verifier }
                redirectUri: { type: string, format: uri, description: Optional http://127.0.0.1:PORT/callback without query, credentials or fragment }
      responses:
        '200':
          description: Ten-minute login flow; open authorizationUrl in the browser
          content:
            application/json:
              schema:
                type: object
                required: [flow, authorizationUrl, expiresAt]
                properties:
                  flow: { type: string, format: uuid }
                  authorizationUrl: { type: string, format: uri }
                  expiresAt: { type: integer }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/google:
    get:
      operationId: redirectToGoogle
      parameters:
        - { name: flow, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '302': { description: Google authorization redirect with browser-bound HttpOnly state cookie }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/google/callback:
    get:
      operationId: googleCallback
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: One-time gateway code and state returned to the registered loopback callback }
        '200': { description: Manual one-time code or sign-in cancellation page, with no-store caching }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/token:
    post:
      operationId: exchangeEmployeeCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [flow, code, codeVerifier]
              properties:
                flow: { type: string, format: uuid }
                code: { type: string }
                codeVerifier: { type: string, pattern: '^[A-Za-z0-9_-]{43,128}$' }
      responses:
        '200': { $ref: '#/components/responses/EmployeeSession' }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/refresh:
    post:
      operationId: refreshEmployeeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/EmployeeSession' }
        default: { $ref: '#/components/responses/Error' }
  /v1/me:
    get:
      operationId: identity
      security: [{ gateway: [] }]
      responses:
        '200':
          description: Current authenticated identity and effective grant inputs
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  kind: { enum: [aws, session, key] }
                  clientId: { type: string }
                  grants: { $ref: '#/components/schemas/Grants' }
                  scope: { $ref: '#/components/schemas/Grants' }
                  admin: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/principals:
    get:
      operationId: listEmployees
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Page of employee records under items with an optional continuation cursor }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/principals/{principal}:
    parameters: [{ $ref: '#/components/parameters/Principal' }]
    get:
      operationId: getEmployee
      security: [{ gateway: [] }]
      responses:
        '200':
          description: Employee record, including current revision, credential epoch and bound Google subject if enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: saveEmployee
      security: [{ gateway: [] }]
      description: Create with no revision, or replace using the current revision. Enrollment email is immutable. Disabling or revokeCredentials invalidates issued credentials. Omitting budget removes the employee limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, enabled, grants]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                enabled: { type: boolean }
                grants: { $ref: '#/components/schemas/Grants' }
                budget: { $ref: '#/components/schemas/Budget' }
                revision: { type: string, format: uuid }
                revokeCredentials: { type: boolean }
      responses:
        '200':
          description: Saved employee with its new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Error' }
  /v1/credentials:
    get:
      operationId: listOwnCredentials
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/Credentials' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createOwnClientKey
      security: [{ gateway: [] }]
      description: Requires an employee session; API keys cannot create credentials
      requestBody: { $ref: '#/components/requestBodies/Key' }
      responses:
        '201': { $ref: '#/components/responses/CreatedKey' }
        default: { $ref: '#/components/responses/Error' }
  /v1/credentials/{credential}:
    delete:
      operationId: revokeOwnCredential
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Credential' }]
      responses:
        '200': { description: Credential revoked; requires an employee session }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/principals/{principal}/credentials:
    parameters: [{ $ref: '#/components/parameters/Principal' }]
    get:
      operationId: listEmployeeCredentials
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/Credentials' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createEmployeeClientKey
      security: [{ gateway: [] }]
      requestBody: { $ref: '#/components/requestBodies/Key' }
      responses:
        '201': { $ref: '#/components/responses/CreatedKey' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/principals/{principal}/credentials/{credential}:
    delete:
      operationId: revokeEmployeeCredential
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Principal' }, { $ref: '#/components/parameters/Credential' }]
      responses:
        '200': { description: Credential revoked }
        default: { $ref: '#/components/responses/Error' }
  /v1/usage:
    get:
      operationId: ownUsage
      security: [{ gateway: [] }]
      parameters:
        - { $ref: '#/components/parameters/Month' }
        - { name: client, in: query, schema: { type: string }, description: Employee sessions can select a credential; API keys are restricted to their own credential }
      responses:
        '200': { $ref: '#/components/responses/Usage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/usage:
    get:
      operationId: administratorUsage
      security: [{ gateway: [] }]
      parameters:
        - { $ref: '#/components/parameters/Month' }
        - { name: principal, in: query, schema: { type: string } }
        - { name: client, in: query, schema: { type: string }, description: Requires principal }
      responses:
        '200': { $ref: '#/components/responses/Usage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/budget:
    get:
      operationId: companyBudget
      security: [{ gateway: [] }]
      responses:
        '200': { description: Optional company budget and current revision; no budget is the default }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: saveCompanyBudget
      security: [{ gateway: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [budget]
              properties:
                budget:
                  oneOf: [{ $ref: '#/components/schemas/Budget' }, { type: 'null' }]
                revision: { type: string, format: uuid }
      responses:
        '200': { description: New policy revision; null removes the limit. Current revision is required when replacing a saved policy. }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/requests:
    get:
      operationId: requestReceipts
      security: [{ gateway: [] }]
      parameters: [{ $ref: '#/components/parameters/Month' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Page of metadata-only receipts under items and an optional cursor. Each has requestId, principalId, clientId, connection, model, operation, startedAt and status; final receipts add duration, reported usage and accounted. Pending means provider outcome unknown. }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/requests/{month}/{request}/reconcile:
    post:
      operationId: reconcileKnownUsage
      security: [{ gateway: [] }]
      description: Idempotently settle a known receipt into monthly totals. Pending/unknown outcomes return 409; this operation does not call the provider.
      parameters:
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: request, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Accounted or already accounted }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    gateway: { type: http, scheme: bearer }
  parameters:
    Principal:
      name: principal
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$', maxLength: 128 }
    Credential:
      name: credential
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque continuation token bound to the selected collection
    Month:
      name: month
      in: query
      schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      description: UTC calendar month; defaults to the current month
    Connection:
      name: connection
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' }
  requestBodies:
    Key:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [clientName, grants]
            properties:
              clientName: { type: string, minLength: 1, maxLength: 100 }
              grants: { $ref: '#/components/schemas/Grants' }
              expiresAt: { type: integer, description: Future Unix milliseconds; defaults to ninety days }
    Messages:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Inference'
              - properties:
                  operation: { enum: [stream, streamSimple, fetchDeferred], default: streamSimple }
    Operations:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Inference'
              - required: [operation]
                properties:
                  operation: { enum: [cancelDeferred, generateImages, classify] }
  schemas:
    Grants:
      type: object
      description: Connection IDs or wildcard mapped to model IDs or wildcard; explicit connection entries override the connection wildcard
      additionalProperties: { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 256 } }
    Budget:
      type: object
      additionalProperties: false
      required: [monthlyUsd, mode]
      properties:
        monthlyUsd: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        mode: { enum: [warn, block] }
      description: Admission policy against recorded cost estimates. No default limit; in-flight overshoot and unpriced usage are possible. This is not an invoice cap.
    Employee:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        googleSub: { type: string }
        enabled: { type: boolean }
        grants: { $ref: '#/components/schemas/Grants' }
        budget: { $ref: '#/components/schemas/Budget' }
        revision: { type: string, format: uuid }
        epoch: { type: integer }
    Credential:
      type: object
      description: Public credential metadata; never includes a secret, hash or epoch
      properties:
        id: { type: string, format: uuid }
        principalId: { type: string }
        kind: { enum: [session, key] }
        clientName: { type: string }
        grants: { $ref: '#/components/schemas/Grants' }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        revoked: { type: boolean }
        revision: { type: string, format: uuid }
    ResponsesRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        model: { type: string, minLength: 1 }
        input:
          oneOf:
            - { type: string }
            - { type: array, items: { type: object, description: Native message, reasoning, function/custom tool call/result, additional_tools, compaction or client tool_search item } }
        instructions: { type: [string, 'null'] }
        stream: { type: boolean, default: true }
        store: { const: false }
        previous_response_id: { type: 'null' }
        background: { const: false }
        tools: { type: array, items: { type: object, required: [type], properties: { type: { enum: [function, custom, namespace, tool_search] } } }, description: tool_search must use execution client; namespace tools receive the same validation }
        tool_choice: { oneOf: [{ type: string }, { type: object }] }
        parallel_tool_calls: { type: boolean }
        reasoning: { type: object }
        text: { type: object }
        include: { type: array, items: { type: string } }
        max_output_tokens: { type: integer, minimum: 1 }
        temperature: { type: number }
        top_p: { type: number }
        service_tier: { type: string }
        truncation: { enum: [auto, disabled] }
        metadata: { type: object, additionalProperties: { type: string } }
        prompt_cache_key: { type: string, description: Namespaced by employee and client identity }
        prompt_cache_retention: { type: string }
        safety_identifier: { type: string, description: Replaced by a gateway-derived identity hash }
        stream_options: { type: object }
    Inference:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: { type: string, minLength: 1 }
        operation: { type: string }
        context: { type: object, description: Native Pi Context, ImagesContext or ClassifierContext according to operation }
        handle: { type: object, description: Gateway-sealed Pi DeferredHandle for fetch/cancel }
        options: { type: object, description: Reviewed inference-only native Pi options. Unknown options and endpoint/auth/routing overrides are rejected. }
  responses:
    EmployeeSession:
      description: Ten-minute access token and rotated refresh credential, with an absolute thirty-day session lifetime. All timestamps are Unix milliseconds.
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, expiresAt, refreshToken, refreshExpiresAt, credential]
            properties:
              accessToken: { type: string }
              expiresAt: { type: integer }
              refreshToken: { type: string }
              refreshExpiresAt: { type: integer }
              credential: { $ref: '#/components/schemas/Credential' }
    Credentials:
      description: Credential metadata page; secrets are never returned by a list
      content:
        application/json:
          schema:
            type: object
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/Credential' } }
              cursor: { type: string }
    CreatedKey:
      description: Key secret returned once; the service stores only its hash
      content:
        application/json:
          schema:
            type: object
            properties:
              key: { type: string }
              credential: { $ref: '#/components/schemas/Credential' }
    Usage:
      description: Monthly totals based on reported Pi usage and cost estimates, without prompt or response content
      content:
        application/json:
          schema:
            type: object
            properties:
              month: { type: string }
              requests: { type: number }
              input: { type: number }
              output: { type: number }
              cacheRead: { type: number }
              cacheWrite: { type: number }
              reasoning: { type: number }
              estimatedUsd: { type: number }
              unpricedRequests: { type: number }
    Error:
      description: JSON error when headers have not started; x-request-id correlates safe logs. Authentication uses 401/403, invalid input 400/415, stale revisions 409, denied budgets or provider rate limits 429, and upstream/storage failures 502. An error does not prove no provider work occurred.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
