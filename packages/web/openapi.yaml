            "$ref": "#/components/responses/Error403"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          }
        }
      },
      "post": {
        "operationId": "createChat",
        "summary": "Create or retrieve a conversation by stable key",
        "tags": [
          "Conversations"
        ],
        "responses": {
          "201": {
            "description": "Native conversation, including key replay.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Chat"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          }
        },
        "requestBody": {
          "required": true,
          "description": "JSON object. Writes require Origin equal to the server URL.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "agent": {
                    "type": "string",
                    "minLength": 1
                  },
                  "key": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Stable client creation identity; reuse to retry the same creation."
                  },
                  "source": {
                    "type": "string",
                    "description": "Configured source ID. Defaults to startup config defaultSource. Creates a new native session only on explicit creation; stable key/agent replays creation."
                  }
                },
                "required": [
                  "agent",
                  "key"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
