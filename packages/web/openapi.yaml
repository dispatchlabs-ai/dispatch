      },
      "post": {
        "operationId": "openKeyedChatLink",
        "summary": "Open an explicitly opted-in native keyed conversation without submitting a message",
        "tags": [
          "Conversations"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "installation": {
                    "type": "string",
                    "minLength": 1
                  },
                  "key": {
                    "type": "string",
                    "minLength": 1
                  },
                  "title": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "required": [
                  "installation",
                  "key",
                  "title"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Existing or newly created native keyed conversation; no message submitted.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Chat"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          }
        }
      }
    },
    "/api/sidebar/events": {
      "get": {
        "operationId": "watchSidebar",
        "summary": "Observe shared native navigation summaries",
        "tags": [
          "Conversations"
        ],
        "responses": {
          "200": {
            "description": "Authenticated SSE. Initial/reconnect snapshot contains full agents, chats, sources and approved avatar keys. Changes coalesce; failure means observation unavailable, never completion. Native working/waiting versus saved/unanswered/unavailable states do not derive from service liveness.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          }
        }
      }
    },
    "/api/avatars/{key}": {
      "get": {
        "operationId": "getAvatar",
        "summary": "Read explicitly approved consumer artwork",
        "tags": [
          "Presentation"
        ],
        "parameters": [
          {
            "in": "path",
            "name": "key",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Exact advertised key: agent:PUBLIC_AGENT_ID or user; never a filesystem path."
          }
        ],
        "responses": {
          "200": {
            "description": "Authenticated PNG/JPEG/WebP bytes loaded from trusted startup bindings."
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "description": "No approved artwork; clients use the placeholder."
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ],
        "additionalProperties": false
      },
      "Agent": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "capabilities": {
            "$ref": "#/components/schemas/Capabilities"
          }
        },
        "required": [
          "id",
          "description"
        ],
        "additionalProperties": false
      },
      "Chat": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "example": "opaque-source-session-conversation-identity",
            "description": "Opaque stable identity of canonical native database path and conversation ID; not a native agent:conversation ID."
          },
          "agent": {
            "type": "string"
          },
          "conversationId": {
            "type": "integer"
          },
          "source": {
            "type": "string",
            "description": "Configured source ID (not transport provenance)."
          },
          "title": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "origin": {
            "type": "object",
            "additionalProperties": true
          },
          "sourceLabel": {
            "type": "string"
          },
          "session": {
            "type": "string"
          },
          "parentId": {
            "type": "string",
            "description": "Owning conversation of a task-run worker. Workers are read-only; steer the parent."
          },
          "transport": {
            "type": "string",
            "enum": [
              "cli",
              "web",
              "slack",
              "google-chat",
              "phone",
              "email",
              "agent",
              "schedule"
            ],
            "description": "Native transport that started an indexed chat. Absent for conversations outside the chat index."
          },
          "addressable": {
            "type": "boolean",
            "description": "Whether this installation can currently send to the conversation."
          },
          "capabilities": {
            "$ref": "#/components/schemas/Capabilities"
          },
          "activity": {
            "type": "string",
            "enum": [
              "working",
              "waiting",
              "idle",
              "unanswered",
              "unavailable"
            ]
          },
          "nativeTitle": {
            "type": "string",
            "description": "Original native title when an AI presentation title is configured."
          }
        },
        "required": [
          "id",
          "agent",
          "conversationId",
          "source",
          "title",
          "createdAt"
        ],
        "additionalProperties": false
      },
      "Artifact": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "mimeType": {
            "type": "string"
          },
          "size": {
            "type": "integer"
          },
          "sha256": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "name",
          "mimeType",
          "size",
          "sha256",
          "createdAt"
        ],
        "additionalProperties": false
      },
      "Message": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "role": {
            "type": "string"
          },
          "text": {
            "type": "string"
          },
          "at": {
            "type": "number"
          },
          "commentary": {
            "type": "string"
          },
          "author": {
            "type": "string"
          },
          "background": {
            "type": "boolean"
          },
          "details": {
            "type": "object",
            "description": "A background reply's supporting material, shown collapsed.",
            "required": [
              "label",
              "text"
            ],
            "properties": {
              "label": {
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            }
          },
          "error": {
            "type": "string"
          },
          "artifacts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Artifact"
            }
          },
          "provenance": {
            "type": "string",
            "enum": [
              "user",
              "agent",
              "runtime"
            ],
            "description": "Derived from native entry kind/source, not text. Runtime continuation/context entries remain in snapshots but are not rendered as user bubbles."
          },
          "attachments": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AttachmentFile"
            }
          }
        },
        "required": [
          "id",
          "role",
          "text",
          "provenance"
        ],
        "additionalProperties": false
      },
      "Retry": {
        "type": "object",
        "properties": {
          "attempt": {
            "type": "integer"
          },
          "at": {
            "type": "number",
            "description": "Epoch milliseconds"
          },
          "error": {
            "type": "string"
          }
        },
        "required": [
          "attempt",
          "at",
          "error"
        ],
        "additionalProperties": false
      },
      "Snapshot": {
        "type": "object",
        "properties": {
          "chat": {
            "$ref": "#/components/schemas/Chat"
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Message"
            }
          },
          "running": {
            "type": "boolean"
          },
          "queued": {
            "type": "integer"
          },
          "partial": {
            "type": "string"
          },
          "tools": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "error": {
            "type": [
              "string",
              "null"
            ]
          },
          "demo": {
            "type": "boolean"
          },
          "background": {
            "type": "boolean"
          },
          "retry": {
            "$ref": "#/components/schemas/Retry"
          },
          "compactions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CompactionStatus"
            }
          },
          "compactionFailure": {
            "$ref": "#/components/schemas/CompactionFailure"
          },
          "readOnly": {
            "type": "string",
            "enum": [
              "worker",
              "internal",
              "owner",
              "unavailable"
            ],
            "description": "Why sending is unavailable: task-run worker, internal service conversation, another process owns it, or the service is unreachable."
          },
          "readOnlyReason": {
            "type": "string",
            "description": "Display sentence for readOnly. Other compatibility errors are returned on explicit admission."
          },
          "observation": {
            "type": "string",
            "description": "Native activity description for read-only history; no live provider partials from external owners."
          },
          "toolCalls": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ToolCall"
            },
            "description": "Actual retained tool identities, arguments/results and native live/task state, grouped by native turn and assistant entry. Missing payload never implies success. No provider reasoning/raw provider diagnostics."
          },
          "turns": {
            "type": "array",
            "description": "Native input/continue submission lifecycle, not tool or project completion.",
            "items": {
              "type": "object",
              "required": [
                "submissionId",
                "status"
              ],
              "properties": {
                "submissionId": {
                  "type": "integer"
                },
                "entryId": {
                  "type": "integer"
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "queued",
                    "placed",
                    "done",
                    "unanswered"
                  ]
                },
                "reason": {
                  "type": "string"
                }
              }
            }
          }
        },
        "required": [
          "chat",
          "messages",
          "running",
          "queued",
          "partial",
          "tools",
          "error",
          "demo",
          "background"
        ],
        "additionalProperties": false
      },
      "CompactionStatus": {
        "type": "object",
        "required": [
          "taskId",
          "trigger",
          "blocking",
          "attempt"
        ],
        "properties": {
          "taskId": {
            "type": "integer"
          },
          "trigger": {
            "type": "string",
            "enum": [
              "manual",
              "threshold",
              "overflow"
            ]
          },
          "blocking": {
            "type": "boolean"
          },
          "attempt": {
            "type": "integer"
          },
          "retry": {
            "type": "object",
            "required": [
              "at",
              "error"
            ],
            "properties": {
              "at": {
                "type": "number"
              },
              "error": {
                "type": "string"
              }
            }
          }
        },
        "additionalProperties": false
      },
      "CompactionFailure": {
        "type": "object",
        "required": [
          "taskId",
          "trigger",
          "error"
        ],
        "properties": {
          "taskId": {
            "type": "integer"
          },
          "trigger": {
            "type": "string",
            "enum": [
              "manual",
              "threshold",
              "overflow"
            ]
          },
          "error": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "Source": {
        "type": "object",
        "required": [
          "id",
          "label",
          "issues"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "label": {
            "type": "string"
          },
          "path": {
            "type": "string",
            "description": "Canonical directory, when available."
          },
          "issues": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "additionalProperties": false
      },
      "AttachmentFile": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "description": "Display/download name only; never authorizes a host path."
          },
          "mimeType": {
            "type": "string",
            "description": "PNG/JPEG/WebP or UTF-8 text/document type. Unsupported binary/PDF/Office content rejects409."
          },
          "data": {
            "type": "string",
            "contentEncoding": "base64",
            "description": "Actual browser-selected bytes, retained in native input metadata and delivered as Pi content blocks."
          }
        },
        "required": [
          "name",
          "mimeType",
          "data"
        ],
        "additionalProperties": false
      },
      "ToolCall": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "callId": {
            "type": "string"
          },
          "entryId": {
            "type": "integer"
          },
          "turnId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "input": {},
          "output": {},
          "details": {},
          "progress": {},
          "status": {
            "type": "string",
            "enum": [
              "running",
              "pending",
              "waiting",
              "completed",
              "failed",
              "cancelled",
              "unavailable"
            ]
          },
          "afterMessageId": {
            "type": "string"
          },
          "parentCallId": {
            "type": "string",
            "description": "Only when actual native nested task input establishes the parent."
          },
          "taskId": {
            "type": "integer"
          }
        },
        "required": [
          "id",
          "callId",
          "entryId",
          "turnId",
          "name",
          "status",
          "afterMessageId"
        ],
        "additionalProperties": false
      },
      "Capabilities": {
        "type": "object",
        "description": "Trusted installation restrictions; omitted fields default to supported. Stop remains available.",
        "properties": {
          "create": {
            "type": "boolean"
          },
          "attachments": {
            "type": "boolean"
          },
          "artifacts": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      }
    },
    "responses": {
      "Error400": {
        "description": "Invalid JSON object, field, URL encoding, or agent selection.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error403": {
        "description": "Host, Origin or Fetch Metadata boundary rejected.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error404": {
        "description": "Route, conversation or artifact not found.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error415": {
        "description": "Content-Type must be application/json.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error500": {
        "description": "Runtime or local file request failed. Saved native work is preserved; check the local server/provider configuration.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error409": {
        "description": "Current attempt rejected before admission: native owner/lock, incompatible release/namespace/cwd/schema/adapter, suspended work outside the selected ownership tree, loop/calendar, missing recipient, unavailable creation source, or child/workflow not a native Chats entry. Recovery reason is included; viewing remains available. Send checks all paused messaging-closure harnesses; Stop checks its implicitly resumed harness under native owner locks. A 409 cannot disprove an earlier uncertain admission: retain that original requestId through refresh/recovery and retry until reconciled.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error401": {
        "description": "Hosted authentication required; the trusted module may provide WWW-Authenticate for browser sign-in.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "parameters": {
      "chatId": {
        "name": "chatId",
        "in": "path",
        "required": true,
        "description": "URL-encoded opaque configured store/session/conversation identity.",
        "schema": {
          "type": "string"
        }
      },
      "artifactId": {
        "name": "artifactId",
        "in": "path",
        "required": true,
        "description": "Immutable artifact ID from a message.",
        "schema": {
          "type": "string"
        }
      },
      "asset": {
        "name": "asset",
        "in": "path",
        "required": true,
        "description": "Build-generated flat filename; letters, digits, underscore, dot and hyphen only.",
        "schema": {
          "type": "string",
          "pattern": "^[a-zA-Z0-9_.-]+$"
        }
      }
    },
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-dispatch_session",
        "description": "Hosted session-auth module. Obtain via POST /login over HTTPS; POST /logout revokes this session and closes its streams."
      },
      "basicAuth": {
        "type": "http",
        "scheme": "basic",
        "description": "Hosted basic-auth module over HTTPS. Credential rotation plus service restart revokes access; no session logout is supplied."
      }
    }
  },
  "x-dispatch-authentication": {
    "loopback": "Only the empty security alternative applies to unauthenticated local mode; exact Host/Origin and Fetch Metadata checks still apply.",
    "hosted": "Authorization is mandatory. Select the sessionCookie or basicAuth scheme matching the installation, or supply the custom adapter contract. The empty alternative does not authorize hosted access.",
    "scope": "A supplied hosted credential authorizes all configured runs, not per-user grants."
  }
}
