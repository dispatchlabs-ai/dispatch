{
  "openapi": "3.1.0",
  "info": {
    "title": "Web API",
    "version": "0.11.2",
    "license": {
      "name": "MIT",
      "identifier": "MIT"
    },
    "description": "Single-user loopback adapter to the consumer-configured native Dispatch runtime. Local mode has no login or bearer credential. Hosted mode requires HTTPS DISPATCH_ORIGIN and a trusted DISPATCH_AUTH_MODULE exporting authorize(request, response) that validates actual credentials/session and authorizes all configured runs; exact configured Host/Origin apply, and API/SSE requests require that authorization. Request-only authorization modules remain compatible. Denied modules may end a 401 browser challenge response and return false; otherwise denial is 403. Health is unauthenticated and secret-free. No per-user grants UI is implemented. Local requests require Host 127.0.0.1:PORT; supplied Origin must equal the server origin; API Fetch Metadata must be same-origin or none; the shell navigation exception is described below. Every write requires the exact Origin header. API writes require application/json; POST /login requires application/x-www-form-urlencoded, and POST /logout needs no body. No CORS. Cross-site API requests and DNS rebinding hosts receive 403. GET / permits external top-level navigation (Sec-Fetch-Mode navigate, Sec-Fetch-Dest document, no Origin) to the nonsensitive app shell only. Local native processes with the same user remain trusted. DISPATCH_PORT defaults to 4319. Unsupported routes/methods return 404 JSON Error. Native API and HTML responses disable caching; approved avatar artwork uses private caching. Responses disable sniffing, framing and cross-origin resource embedding. The optional session-auth module redirects anonymous shell visits to /login and successful form submissions to the original same-origin conversation link (otherwise /). Request text and identities must contain non-whitespace characters. The app sets no character or body-byte cap; native/provider context constraints still apply. GET needs no Origin for browser navigation or native inspection. Named local installations use installation~localId identities; creation sources must belong to the selected installation. Legacy single-installation IDs remain unchanged; one explicitly configured primary named installation may preserve unqualified conversation IDs. Catalogs are lightweight native read-only observations; selected routes use direct identity lookup. Browser IndexedDB stores only per-tab drafts/uncertain outbox, never authoritative conversation state. Optional session-auth.js provides GET/POST /login and POST /logout with a Secure HttpOnly SameSite=Strict host-only session cookie (30-day expiry renewed daily on authenticated requests; DISPATCH_SESSION_STATE_FILE durably retains only digests/expiry bound to credentials and origin); native form writes require the exact Origin. Referrer-Policy is same-origin. External top-level GET /login is allowed by the same document-navigation exception as GET /."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:4319",
      "description": "Local mode; hosted deployments use their configured HTTPS origin"
    }
  ],
