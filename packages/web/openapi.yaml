    "/api/chats/{chatId}/events": {
      "get": {
        "operationId": "watchChat",
        "summary": "Stream full native snapshots using Server-Sent Events",
        "tags": [
          "Conversations"
        ],
        "responses": {
          "200": {
            "description": "Long-lived SSE with full snapshot on attach and once per second, using committed native watch-reader history for external/unowned sessions and native live snapshots for app-owned chats. External provider partials are unavailable. Observation never opens an owner or resumes work. event: failure precedes observation failure close. Keepalive every 15 seconds; slow frames coalesce; reconnect reloads, never resubmits.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "example": "event: snapshot\ndata: {\"chat\": {\"id\":\"helper:9\"}, \"messages\": []}\n\n"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/chatId"
          }
        ]
      }
    },
