    "/login": {
      "get": {
        "summary": "Sign in or manage the current session (optional session authorization module)",
        "responses": {
          "200": {
            "description": "HTML sign-in or signed-in session page.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          }
        },
        "security": [],
        "operationId": "loginPage",
        "parameters": [
          {
            "name": "returnTo",
            "in": "query",
            "required": false,
            "description": "Return to / or /? with installation, chat, key, title and context query fields. Other destinations normalize to /; no external redirect. This is a query parameter, not a form field.",
            "schema": {
              "type": "string"
            }
          }
        ]
      },
      "post": {
        "summary": "Verify credentials and create a durable session (session-auth module)",
        "responses": {
          "303": {
            "description": "Same-origin redirect; session cookie set or cleared.",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                },
                "description": "Sanitized returnTo on sign-in, /login on sign-out."
              },
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                },
                "description": "Secure, HttpOnly, SameSite=Strict __Host-dispatch_session cookie."
              }
            }
          },
          "400": {
            "description": "Credential upload disconnected or could not be read.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "401": {
            "description": "Incorrect or missing username/password.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "408": {
            "description": "Credential upload exceeded the 15-second deadline.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "413": {
            "description": "Credential form exceeds 8192 bytes.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "415": {
            "description": "Use application/x-www-form-urlencoded.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "429": {
            "description": "Six sign-in attempts admitted in the preceding minute; retry later.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          }
        },
        "security": [],
        "operationId": "login",
        "parameters": [
          {
            "name": "returnTo",
            "in": "query",
            "required": false,
            "description": "Return to / or /? with installation, chat, key, title and context query fields. Other destinations normalize to /; no external redirect. This is a query parameter, not a form field.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "description": "The exact configured HTTPS origin, without a trailing slash.",
            "schema": {
              "type": "string",
              "format": "uri"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "type": "object",
                "required": [
                  "username",
                  "password"
                ],
                "properties": {
                  "username": {
                    "type": "string",
                    "minLength": 1
                  },
                  "password": {
                    "type": "string",
                    "minLength": 1,
                    "format": "password"
                  }
                }
              }
            }
          }
        }
      }
    },
