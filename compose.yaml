# Hosted Web: consumer image includes trusted authorization module, definitions
# and host providers. Provision /data/config.json and private files separately.
services:
  web:
    image: ${DISPATCH_IMAGE:?Select an immutable image digest}
    restart: "no"
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DISPATCH_HOST: 0.0.0.0
      DISPATCH_PORT: "3001"
      DISPATCH_ORIGIN: ${DISPATCH_ORIGIN:?Supply an HTTPS browser origin}
      DISPATCH_AUTH_MODULE: /data/authorize.mjs
      DISPATCH_CONFIG: /data/config.json
    volumes:
      - type: bind
        source: ${DISPATCH_STATE:?Supply a dedicated persistent state directory}
        target: /data
    read_only: true
    tmpfs:
      - /tmp
